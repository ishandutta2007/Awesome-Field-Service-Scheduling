<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="100%" height="100%">
  <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="50%" stop-color="#1e1b4b"/>
      <stop offset="100%" stop-color="#311042"/>
    </linearGradient>
    
    <linearGradient id="accent-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#6366f1"/>
      <stop offset="50%" stop-color="#a855f7"/>
      <stop offset="100%" stop-color="#ec4899"/>
    </linearGradient>
    
    <linearGradient id="card-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="rgba(255, 255, 255, 0.08)"/>
      <stop offset="100%" stop-color="rgba(255, 255, 255, 0.02)"/>
    </linearGradient>

    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>

    <style>
      .title { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-weight: 800; font-size: 46px; fill: #ffffff; }
      .subtitle { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-weight: 500; font-size: 20px; fill: #cbd5e1; }
      .tag { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-weight: 600; font-size: 13px; fill: #38bdf8; letter-spacing: 1.5px; }
      .card-text { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-size: 12px; fill: #94a3b8; }
      .card-val { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-weight: 700; font-size: 14px; fill: #f8fafc; }
      
      /* Dynamic / Animated elements background layer */
      @keyframes float1 {
        0% { transform: translateY(0px) rotate(0deg); }
        50% { transform: translateY(-12px) rotate(1deg); }
        100% { transform: translateY(0px) rotate(0deg); }
      }
      @keyframes float2 {
        0% { transform: translateY(0px) rotate(0deg); }
        50% { transform: translateY(10px) rotate(-1deg); }
        100% { transform: translateY(0px) rotate(0deg); }
      }
      @keyframes pulse-line {
        0% { stroke-dashoffset: 400; }
        100% { stroke-dashoffset: 0; }
      }
      @keyframes radar-sweep {
        0% { transform: rotate(0deg); }
        100% { transform: rotate(360deg); }
      }
      
      .animated-card1 { animation: float1 6s ease-in-out infinite; }
      .animated-card2 { animation: float2 7s ease-in-out infinite; }
      .pulse-path { stroke-dasharray: 20 10; animation: pulse-line 15s linear infinite; }
      .radar-line { transform-origin: 1020px 180px; animation: radar-sweep 10s linear infinite; }
    </style>
  </defs>

  <!-- Background -->
  <rect width="1200" height="360" rx="16" fill="url(#bg-grad)"/>

  <!-- Subtle Grid Pattern -->
  <g opacity="0.05" stroke="#ffffff" stroke-width="1">
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <rect width="40" height="40" fill="none"/>
      <path d="M 40 0 L 0 0 0 40"/>
    </pattern>
    <rect width="1200" height="360" fill="url(#grid)" />
  </g>

  <!-- DYNAMIC / ANIMATED BACKGROUND ELEMENTS (positioned right and behind text) -->
  <!-- Glowing Background Orbs -->
  <circle cx="980" cy="180" r="140" fill="#6366f1" opacity="0.15" filter="url(#glow)"/>
  <circle cx="820" cy="240" r="90" fill="#ec4899" opacity="0.12" filter="url(#glow)"/>

  <!-- Route Dispatch Path Line -->
  <path class="pulse-path" d="M 680 260 Q 780 120 900 200 T 1120 140" fill="none" stroke="url(#accent-grad)" stroke-width="3" opacity="0.5"/>
  
  <!-- Map Location Nodes -->
  <g opacity="0.7">
    <circle cx="680" cy="260" r="6" fill="#38bdf8"/>
    <circle cx="680" cy="260" r="14" fill="none" stroke="#38bdf8" stroke-width="1.5" opacity="0.5"/>
    
    <circle cx="780" cy="145" r="6" fill="#a855f7"/>
    <circle cx="900" cy="200" r="6" fill="#ec4899"/>
    
    <circle cx="1120" cy="140" r="8" fill="#34d399" filter="url(#glow)"/>
    <circle cx="1120" cy="140" r="18" fill="none" stroke="#34d399" stroke-width="2" opacity="0.6"/>
  </g>

  <!-- Dynamic Tech Cards (Floating in Background Right Side) -->
  <g class="animated-card1">
    <rect x="740" y="50" width="180" height="70" rx="10" fill="url(#card-grad)" stroke="rgba(255, 255, 255, 0.15)" stroke-width="1"/>
    <text x="755" y="75" class="card-text">⚡ AI Dispatch Engine</text>
    <text x="755" y="98" class="card-val">Optimal Route: 98.4%</text>
  </g>

  <g class="animated-card2">
    <rect x="940" y="220" width="200" height="75" rx="10" fill="url(#card-grad)" stroke="rgba(255, 255, 255, 0.15)" stroke-width="1"/>
    <text x="955" y="245" class="card-text">📅 Technician Schedule</text>
    <text x="955" y="270" class="card-val">Capacity: 142 Jobs/Day</text>
  </g>

  <!-- Decorative Top Accent Bar -->
  <rect x="0" y="0" width="1200" height="5" fill="url(#accent-grad)" />

  <!-- FOREGROUND CONTENT (Guaranteed high visibility and clear layout) -->
  <g transform="translate(60, 0)">
    <!-- Category Pill Tag -->
    <rect x="0" y="55" width="230" height="28" rx="14" fill="rgba(56, 189, 248, 0.12)" stroke="rgba(56, 189, 248, 0.3)" stroke-width="1"/>
    <text x="15" y="74" class="tag">AWESOME CURATED LIST</text>

    <!-- Main Title -->
    <text x="0" y="140" class="title">Field Service Scheduling</text>

    <!-- Subtitle -->
    <text x="0" y="185" class="subtitle">SaaS Platforms, Route Optimization &amp; Open-Source FSM Systems</text>

    <!-- Key Feature Badges / Highlights -->
    <g transform="translate(0, 225)">
      <!-- Item 1 -->
      <rect x="0" y="0" width="160" height="38" rx="8" fill="rgba(255, 255, 255, 0.06)" stroke="rgba(255, 255, 255, 0.1)"/>
      <text x="15" y="24" font-family="-apple-system, sans-serif" font-size="13" font-weight="600" fill="#e2e8f0">🗓️ Smart Booking</text>

      <!-- Item 2 -->
      <rect x="175" y="0" width="160" height="38" rx="8" fill="rgba(255, 255, 255, 0.06)" stroke="rgba(255, 255, 255, 0.1)"/>
      <text x="190" y="24" font-family="-apple-system, sans-serif" font-size="13" font-weight="600" fill="#e2e8f0">📍 GPS Dispatch</text>

      <!-- Item 3 -->
      <rect x="350" y="0" width="180" height="38" rx="8" fill="rgba(255, 255, 255, 0.06)" stroke="rgba(255, 255, 255, 0.1)"/>
      <text x="365" y="24" font-family="-apple-system, sans-serif" font-size="13" font-weight="600" fill="#e2e8f0">⚡ Route Optimization</text>
    </g>

    <!-- Footer Meta -->
    <text x="0" y="310" font-family="-apple-system, sans-serif" font-size="13" fill="#64748b">
      Updated September 2026 • Maintained by <tspan fill="#94a3b8">@ishandutta2007</tspan>
    </text>
  </g>
</svg>
